{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-key-vault
  namespace: {{ .Release.Namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "keyVault.clientId is required" .Values.keyVault.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range $key, $name := .Values.keyVault.objects }}
        {{- if and (or $.Values.sqlserver.enabled (ne $key "SQLSERVER_SA_PASSWORD")) (or $.Values.mongo.enabled (ne $key "MONGO_ROOT_PASSWORD")) }}
        - |
          objectName: {{ $name }}
          objectType: secret
        {{- end }}
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      data:
        {{- range $key, $name := .Values.keyVault.objects }}
        {{- if and (or $.Values.sqlserver.enabled (ne $key "SQLSERVER_SA_PASSWORD")) (or $.Values.mongo.enabled (ne $key "MONGO_ROOT_PASSWORD")) }}
        - objectName: {{ $name }}
          key: {{ $key }}
        {{- end }}
        {{- end }}
    {{- if .Values.sqlserver.enabled }}
    - secretName: sqlserver-secret
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.objects.SQLSERVER_SA_PASSWORD }}
          key: SA_PASSWORD
    {{- end }}
{{- end }}
